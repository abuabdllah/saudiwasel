    <title>تسجيل نماذج SaudiWasel</title>

  <body>

      <input name="city" />
      <input name="cityName" />
      <input name="otherCity" />
      <input name="district" />
      <input name="service" />
      <input name="operator" />
      <input name="buildingType" />
      <textarea name="notes"></textarea>
      <input name="buildingLocation" />
      <input name="consent" />
      <input name="consentVersion" />
      <input name="sourcePath" />
      <input name="submissionId" />
